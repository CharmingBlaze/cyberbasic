[package]
name = "cyberbasic"
version = "0.1.0"
edition = "2021"
description = "CyberBasic compiler and CLI"

[[bin]]
name = "cyberbasic"
path = "src/main.rs"

[lib]
# rlib for the CLI and tests, cdylib for the browser playground (wasm32-unknown-unknown).
name = "cyberbasic_core"
crate-type = ["rlib", "cdylib"]
